name: Desktop Release

# Publishes signed ShiftLog desktop bundles (macOS + Linux) to GitHub Releases
# and generates the `latest.json` manifest the in-app updater reads.
#
# Release flow: push a tag like `desktop-v0.1.0` (or run manually), then the
# built installers + updater artifacts are uploaded to a GitHub Release, and
# installed apps auto-update on next launch.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

# Required so tauri-action can create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple silicon (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel macs
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xdg-utils

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared schema
        run: pnpm --filter @shift-log/schema build

      - name: Publish desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (required for the in-app updater to accept updates)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Desktop UI talks to the API directly; baked in at build time.
          NEXT_PUBLIC_SHIFTLOG_API_BASE: ${{ vars.SHIFTLOG_API_BASE }}
          NEXT_PUBLIC_SHIFTLOG_API_TOKEN: ${{ secrets.SHIFTLOG_API_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: "ShiftLog Desktop v__VERSION__"
          releaseBody: "See the assets below to download and install. Installed apps auto-update on next launch."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
