schema_version = 1

[template]
name = "http-api"
version = 1

[common_harness]
name = "pstack"
ref = "7a583913eb1b8d1a0ee76753d1a2cf072e7b54f9"
skills = ["create-verification-skill", "maintain-verification-skill"]

[target_harness]
name = "shift-log-workspace-harness"
version = 1

[spec]
paths = ["docs/specs/shift-log.md"]
approval_branch = "main"

[delegation]
mode = "observe_only"
allowed_paths = []
forbidden_paths = [".garden/**", "docs/specs/**", ".github/workflows/**"]
max_retries = 0
max_duration_sec = 600
max_cost_usd = 0.0
require_checks = ["toolchain", "workspace_verify"]

[checks.toolchain]
kind = "check"
command = ["node", ".garden/harness/check-toolchain.mjs"]
timeout_sec = 300
covers = ["AC-001"]
required_evidence = ["toolchain-diagnostic.json"]
inconclusive_exit_codes = [75]
status = "active"

[checks.workspace_verify]
kind = "check"
command = ["node", ".garden/harness/verify-workspace.mjs"]
timeout_sec = 300
covers = ["AC-002", "INV-001"]
required_evidence = ["workspace-verify-result.json"]
inconclusive_exit_codes = [75]
status = "active"

[[triggers]]
id = "pr-verify"
event = "pull_request"
flow = "verify_only"
[triggers.conditions]
actions = ["opened", "synchronize"]

[flows.verify_only]
description = "承認済み仕様に基づき、変更を加えずに ShiftLog のツールチェーン・全ワークスペーステスト・型検査を検証する"
scope = "all_specs"

[[flows.verify_only.steps]]
id = "check_toolchain"
type = "check"
check = "toolchain"
on_fail = "escalate"
on_inconclusive = "escalate"

[[flows.verify_only.steps]]
id = "check_workspace"
type = "check"
check = "workspace_verify"
on_fail = "escalate"
on_inconclusive = "escalate"

[[flows.verify_only.steps]]
id = "final_gate"
type = "gate"
require_checks = ["toolchain", "workspace_verify"]

[[flows.verify_only.steps]]
id = "emit_report"
type = "report"
kind = "auto"
