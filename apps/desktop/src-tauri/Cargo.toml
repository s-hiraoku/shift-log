[package]
name = "shiftlog-desktop"
version = "0.1.0"
description = "ShiftLog desktop app — bundles the ShiftLog UI and runs the background collector agent."
authors = ["ShiftLog"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shiftlog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
