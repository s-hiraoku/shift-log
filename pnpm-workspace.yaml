packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Opt out of pnpm 11's 24h minimumReleaseAge so renovate-bumped lockfile entries install in CI.
minimumReleaseAge: 0

# pnpm 11+ ignores non-auth keys in .npmrc. Fail on a packageManager mismatch
# instead of downloading another pnpm. .npmrc still gates pnpm 9.
pmOnFail: error
engineStrict: true


# tsx / vitest / vite depend on esbuild's postinstall binary.
allowBuilds:
  esbuild: true
